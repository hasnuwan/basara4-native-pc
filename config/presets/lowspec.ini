# ==============================================================================
# SPARTANPORT LOW-SPEC PRESET (LINUX)
# Dioptimalkan untuk Laptop Hemat Daya, Intel UHD/Iris, AMD APU Vega/RDNA, & GPU Kentang
# ==============================================================================

# Resolusi Rendering: 720p (1280x720) menghemat ~55% beban pixel shader dibandingkan 1080p
render_resolution=1280x720
output_res=1280x720
display_mode=fullscreen

# Frame Rate: Kunci di 60 FPS untuk efisiensi CPU & temperatur baterai
engine_fps=60
fps_limit=60
vsync=0

# Shaders & GPU Readback: Aktifkan kompilasi asinkron agar tidak stutter
async_shaders=1
deferred_readback=1
stale_readback=1
frames_queued=1

# Post Processing: Matikan upscaler berat (FSR3/4), gunakan RCAS (Contrast Adaptive Sharpening)
upscaler=off
preset=0
sharpen=1
sharpness=0.65
jitter=0
reactive=0
object_motion=0
fsr1=0
rcas=1
rcas_strength=75

# Filter Tekstur: Anisotropy mati untuk meringankan memori bandwidth
anisotropy=0

# HUD & In-Game Telemetry
show_fps=1
overlay_fps=1
overlay_frametime=1
overlay_upscaler=0
overlay_gpu=1
overlay_cpu=1
overlay_ram=1
overlay_vram=1
overlay_scale=90
overlay_corner=1
overlay_opacity=60
overlay_layout=0

# Gameplay & Hooks
enemy_health_bar=1
auto_qte=0
damage_dealt=1.000
damage_taken=1.000
red_orb_multiplier=1.000
green_orb_multiplier=1.000
blue_orb_multiplier=1.000
gold_orb_multiplier=1.000
live_resolution=0
