# ==============================================================================
# SPARTANPORT STEAM DECK & HANDHELD PRESET (LINUX)
# Dioptimalkan untuk Layar 16:10 (1280x800), SteamOS / Handheld Linux
# ==============================================================================

render_resolution=1280x720
output_res=1280x720
display_mode=borderless

engine_fps=60
fps_limit=60
vsync=1

async_shaders=1
deferred_readback=1
stale_readback=1
frames_queued=1

upscaler=off
preset=0
sharpen=1
sharpness=0.70
jitter=0
reactive=0
object_motion=0
fsr1=0
rcas=1
rcas_strength=80

anisotropy=2
show_fps=1
overlay_fps=1
overlay_frametime=1
overlay_scale=85
overlay_corner=1
overlay_opacity=50
overlay_layout=0

enemy_health_bar=1
auto_qte=0
damage_dealt=1.000
damage_taken=1.000
red_orb_multiplier=1.000
live_resolution=0
